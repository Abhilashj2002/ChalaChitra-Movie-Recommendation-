<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ChalaChitra chatbot page preview</title>
  <desc id="desc">A documentation image showing the ChalaChitra AI movie chatbot interface.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#page)"/>
  <rect x="0" y="0" width="260" height="900" fill="#09090b"/>
  <rect x="34" y="36" width="52" height="52" rx="14" fill="#f59e0b"/>
  <text x="48" y="69" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">CM</text>
  <text x="102" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">ChalaChitra</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700">
    <text x="48" y="170" fill="#a1a1aa">Search</text>
    <text x="48" y="222" fill="#a1a1aa">Moods</text>
    <rect x="24" y="250" width="212" height="48" rx="14" fill="#312e81"/>
    <text x="48" y="281" fill="#ffffff">Chat Assistant</text>
    <text x="48" y="334" fill="#a1a1aa">Settings</text>
    <text x="48" y="386" fill="#a1a1aa">Admin Dashboard</text>
  </g>
  <main>
    <text x="330" y="96" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#ffffff">Chat Assistant</text>
    <text x="330" y="130" font-family="Arial, sans-serif" font-size="16" fill="#a1a1aa">Ask for movie ideas, actor details, genres, languages, or mood-based recommendations.</text>
    <rect x="330" y="172" width="780" height="608" rx="28" fill="#111827" stroke="#374151" filter="url(#shadow)"/>
    <rect x="330" y="172" width="780" height="82" rx="28" fill="url(#accent)"/>
    <text x="382" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">ChalaChitra Assistant</text>
    <circle cx="1050" cy="213" r="8" fill="#22c55e"/>
    <g font-family="Arial, sans-serif" font-size="17">
      <rect x="378" y="302" width="412" height="78" rx="22" fill="#1f2937"/>
      <text x="404" y="335" fill="#e5e7eb">Hi! I can help you find a film</text>
      <text x="404" y="361" fill="#e5e7eb">for tonight. What are you in the mood for?</text>
      <rect x="642" y="424" width="420" height="70" rx="22" fill="#4f46e5"/>
      <text x="672" y="466" fill="#ffffff">Suggest Kannada thrillers with strong ratings.</text>
      <rect x="378" y="536" width="548" height="112" rx="22" fill="#1f2937"/>
      <text x="404" y="570" fill="#e5e7eb">Great pick. Try Kantara, U-Turn, or Kavaludaari.</text>
      <text x="404" y="598" fill="#e5e7eb">I can also filter by actor, language, genre, or mood.</text>
      <text x="404" y="626" fill="#818cf8">Fetching related titles from TMDB when your key is configured.</text>
    </g>
    <rect x="378" y="696" width="684" height="54" rx="18" fill="#0f172a" stroke="#334155"/>
    <text x="406" y="730" font-family="Arial, sans-serif" font-size="15" fill="#64748b">Ask about movies...</text>
    <circle cx="1028" cy="723" r="22" fill="#4f46e5"/>
    <path d="M1018 723h18m0 0-7-7m7 7-7 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </main>
</svg>
