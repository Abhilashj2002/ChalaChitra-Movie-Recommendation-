<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChalaChitra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Kannada', 'sans-serif'],
            },
            colors: {
              brand: {
                primary: '#EAB308',
                secondary: '#4F46E5',
              }
            },
            boxShadow: {
              'luxe': '0 20px 25px -5px rgba(79, 70, 229, 0.1), 0 8px 10px -6px rgba(79, 70, 229, 0.1)',
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Kannada:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.4s ease, color 0.2s ease;
        }
        body {
            font-family: 'Inter', 'Noto Sans Kannada', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            margin: 0;
        }
        
        body.light {
            background-color: #ffffff;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 100%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 100%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 100%), 
                radial-gradient(at 0% 50%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 100%), 
                radial-gradient(at 50% 50%, hsla(224,100%,98%,1) 0, hsla(224,100%,98%,1) 100%), 
                radial-gradient(at 100% 50%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 100%), 
                radial-gradient(at 0% 100%, hsla(253,16%,7%,0) 0, hsla(253,16%,7%,0) 100%), 
                radial-gradient(at 50% 100%, hsla(225,39%,30%,0) 0, hsla(225,39%,30%,0) 100%), 
                radial-gradient(at 100% 100%, hsla(339,49%,30%,0) 0, hsla(339,49%,30%,0) 100%);
            background-attachment: fixed;
        }

        .dark body {
            background-color: #050505;
            color: #ffffff;
            background-image: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(79, 70, 225, 0.1);
        }
        .dark .glass-panel {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
